name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      repository:
        description: 'Target private repository to build'
        required: false
        default: 'hieuxyz00/hyperverse'
      branch:
        description: 'Branch to checkout'
        required: false
        default: 'main'
  repository_dispatch:
    types: [ build, trigger-build ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.repository || github.event.inputs.repository || github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Build & Release Pipeline
    runs-on: ubuntu-26.04

    steps:
      - name: Resolve Target Repository
        id: resolve
        run: |
          TARGET_REPO="${{ github.event.client_payload.repository || github.event.inputs.repository || 'hieuxyz00/hyperverse' }}"
          TARGET_REF="${{ github.event.client_payload.branch || github.event.inputs.branch || 'main' }}"
          echo "repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "Target repository: $TARGET_REPO (ref: $TARGET_REF)"

      - name: Configure Git
        # actions/checkout runs `git init`; set the default branch so it does not print the 'master' hint.
        run: git config --global init.defaultBranch main

      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        # Installs exactly the pnpm pinned in web/package.json ("packageManager", e.g. pnpm@12.18.0).
        # pnpm/action-setup bootstrapped another major and switched versions, printing a PNPM_HOME warning.
        run: |
          PM="$(node -p "require('./web/package.json').packageManager.split('+')[0]")"
          npm install --global --no-fund --no-audit "$PM"
          pnpm --version

      - name: Setup Java Toolchain
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java Runtime
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'

      - name: Execute Pipeline
        run: |
          chmod +x .ci/build.sh
          ./.ci/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: ignore
          retention-days: 14
